plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lsposedmodule'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lsposedmodule"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 官方正确的稳定依赖
    compileOnly 'io.github.libxposed:api:100'
}
