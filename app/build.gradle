plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lsposedmodule'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lsposedmodule"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 使用兼容新版 LSPosed 的通用 Xposed API 依赖
    compileOnly 'de.robv.android.xposed:api:82'
}
