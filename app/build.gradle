plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lsposedmodule'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lsposedmodule"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 引入支持最新 LSPosed (API 100/101+) 的现代 libxposed 接口库
    compileOnly 'io.github.libxposed:api:100'
    compileOnly 'io.github.libxposed:service:100'
}
